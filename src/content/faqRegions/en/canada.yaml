  title: 'FAQ for Canadian developers | BIM Delivery'
  description: 'Metric and Imperial fluency, municipal approvals, harsh climate envelopes, bilingual drawing sets, and dedicated pods: answers for Canada.'
questions:
  - id: metric-and-imperial
    question: 'Can your team switch seamlessly between Metric (municipal/institutional) and Imperial (private residential/US-influenced) standards?'
    answer: "Yes. We recognize Canada's dual-unit reality. We configure project templates cleanly for either Metric (mm/m) or Imperial (ft/in) according to your municipality and developer standards, ensuring zero rounding or schedule discrepancies."
  - id: buildingsmart-canada
    question: 'Are your workflows aligned with buildingSMART Canada (IBC) and municipal guidelines like the City of Toronto or Vancouver BIM standards?'
    answer: 'Yes. We align our BEPs, LOD progressions, and model structures with buildingSMART Canada best practices, ISO 19650, and municipal digital submission requirements.'
  - id: faster-approvals
    question: 'How can your BIM services help accelerate slow Canadian municipal zoning and site plan approvals?'
    answer: 'We produce highly accurate Site Plan Approval (SPA) packages, 3D massing studies, shadow impact models, and landscape grading/stormwater coordination models that answer municipal planner objections upfront—reducing review cycles.'
  - id: harsh-climates
    question: 'How do you handle envelope and landscape modeling for harsh Canadian climates (snow loads, thermal bridging, freeze-thaw)?'
    answer: "We model detailed building envelope assemblies (curtain walls, insulation continuity, flashing) and site grading/drainage accurately to your consultant specifications, running clash detection to ensure structural/MEP penetrations don't compromise thermal or waterproofing integrity."
  - id: bilingual-drawing-sets
    question: 'Can you support bilingual (English/French) drawing sets for developments in Quebec or federal projects?'
    answer: 'Yes. Using parametric shared parameters and bilingual Revit title blocks/schedules provided by your team, we maintain synchronized English/French annotation sets without duplicating model geometry.'
  - id: ipd-and-p3
    question: 'How do you integrate with Integrated Project Delivery (IPD) and Public-Private Partnership (P3) workflows?'
    answer: 'We work directly inside your shared cloud CDE (ACC/BIM 360), participating in regular Big Room coordination cycles and delivering rapid, transparent model updates that keep developers, GCs, and trade partners aligned.'
  - id: offshore-pod-savings
    question: 'Canadian cities face severe BIM talent shortages and high local overhead—how much can we save with a dedicated offshore pod?'
    answer: 'Developers and planning firms typically achieve **40%–60% cost savings** compared to hiring full-time in-house BIM technicians in Toronto, Vancouver, or Calgary, while gaining instant access to a 60+ specialist bench that scales up or down with project phases.'
  - id: podiums-and-rooftop-landscapes
    question: 'Can you coordinate underground parking, podiums, and rooftop amenity landscapes in high-density transit-oriented developments (TOD)?'
    answer: 'Yes. Podium-to-landscape coordination (soil depth over structural slabs, drainage, planters, and architectural skylights) is one of our strongest niches, preventing costly leaks and structural rework in high-density towers.'
  - id: pipeda-confidentiality
    question: 'How do you handle Canadian privacy laws (PIPEDA) and developer confidentiality for unannounced land acquisitions?'
    answer: 'We execute strict Canadian-compliant NDAs, isolate unannounced feasibility/massing projects in restricted cloud folders, and never disclose or showcase client projects without explicit written permission.'
  - id: scaling-up
    question: 'What happens if our project scope suddenly doubles after a land rezoning win?'
    answer: 'Because we maintain a multi-disciplinary team across Architecture, Interiors, and Landscape, we can onboard additional trained BIM modelers onto your standards within 5–7 business days—eliminating months of local recruiting delays.'
