seo:
  title: 'FAQ for US developers and architects | BIM Delivery'
  description: 'Imperial templates, BIMForum LOD, AHJ permitting, 5D takeoffs, IP protection, and the follow the sun schedule: answers for US projects.'
questions:
  - id: imperial-units-and-lod
    question: 'How do you ensure models comply with US Imperial units, AIA BIM protocols, and BIMForum LOD specifications?'
    answer: "Every US project is initialized using native Imperial Revit templates configured to the latest BIMForum LOD (100–500) specification and your project's BIM Execution Plan (BEP). Our QA/QC team runs automated Model Checker audits before every milestone to guarantee zero metric/imperial conversion errors."
  - id: gis-and-civil-3d
    question: 'Can your Landscape and Site BIM models integrate with Esri ArcGIS and Civil 3D for masterplanning and city zoning reviews?'
    answer: 'Yes. We maintain strict shared coordinate systems (State Plane / WGS84) so our Revit architectural/landscape models align seamlessly with Civil 3D surfaces and Esri ArcGIS/InfraWorks environments, enabling accurate zoning envelopes, setback checks, and municipal GIS integration.'
  - id: reduce-change-orders
    question: 'How does outsourcing BIM reduce our hard construction costs and change orders?'
    answer: 'By executing multi-discipline clash detection (Navisworks) and constructability reviews at LOD 350 before tender, we typically identify and resolve hundreds of spatial conflicts between architecture, interiors, landscape hardscape, and underground utilities—preventing expensive RFIs and field rework that erode developer margins.'
  - id: quantity-takeoffs-5d
    question: 'Can your models support 5D BIM (Quantity Takeoffs & Cost Estimation) to validate contractor bids?'
    answer: 'Absolutely. We model with strict Uniformat II / MasterFormat coding and clean element parameters so your pre-construction team or cost estimators can extract reliable, live Quantity Takeoffs (QTO) directly from Revit to benchmark GC bids.'
  - id: ip-nda-data-security
    question: 'How do you handle US Intellectual Property (IP) protection, NDAs, and data security?'
    answer: 'We sign US-jurisdiction mutual NDAs, operate strictly within your secure Autodesk Construction Cloud (ACC / BIM 360) environment so files never reside on unauthorized local drives, and enforce role-based access control across our studio.'
  - id: ada-and-ibc
    question: 'Do your models account for US codes like ADA accessibility and IBC egress clearances?'
    answer: 'While your US-licensed Architect of Record (AoR) retains legal stamping authority, our BIM specialists model to your redlines with active awareness of ADA clearances (turning radii, ramp slopes in landscape/interiors) and IBC spatial rules, flagging potential non-compliances early.'
  - id: time-difference
    question: 'How does the 11-to-14-hour time difference with Vietnam actually benefit our development schedule?'
    answer: 'It creates a 24-hour "follow-the-sun" production cycle. Your US team uploads markups or city review comments at 5:00 PM EST/PST, our team executes the revisions during your night, and updated models/sheets are ready in ACC when you log in at 8:00 AM.'
  - id: lod-500-cobie
    question: 'Can you deliver LOD 500 As-Built models with COBie data for our property management and FM teams?'
    answer: 'Yes. We update design models against contractor redlines and laser scans (Scan-to-BIM) to deliver clean LOD 500 digital twins populated with COBie asset attributes ready for upload into Archibus, Maximo, or Procore.'
  - id: hearings-and-pitch-decks
    question: 'How do you support public hearings, HOA approvals, and investor pitch decks?'
    answer: 'From the same single-source-of-truth BIM model, we produce accurate massing studies, shadow/solar analyses, sightline views, and real-time Enscape/Twinmotion walkthroughs so planners and developers can win stakeholder approval faster.'
  - id: pilot-project
    question: "Can we test your team's quality before committing to a multi-phase masterplan?"
    answer: 'Yes. We recommend starting with a low-risk pilot—such as modeling one typical residential/hospitality unit or a defined landscape parcel—using your exact standards so your BIM Manager can audit our model hygiene firsthand.'
