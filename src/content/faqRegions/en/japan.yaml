  description: 'MLIT BIM guidelines, Project PLATEAU, zero defect QA/QC, Japanese speaking coordinators, and trial projects: answers for projects in Japan.'
questions:
  - id: mlit-guidelines
    question: "Do you comply with Japan's MLIT BIM Guidelines (国土交通省BIMガイドライン) and Japanese Revit templates?"
    answer: "Yes. We are experienced with MLIT BIM guidelines, Japanese-standard Revit templates (such as Autodesk's Japan content library and BooT.one workflows), and JIS drawing/dimensioning conventions required by Japanese developers and general contractors (Zenekon)."
  - id: project-plateau
    question: "Can your urban and landscape BIM models integrate with MLIT's Project PLATEAU (3D City Models / CityGML)?"
    answer: "Yes. We align our masterplan, architectural, and landscape models with Japan's Plane Rectangular Coordinate System so they integrate smoothly with Project PLATEAU CityGML datasets for urban simulation, wind/sunlight studies, and municipal presentations."
  - id: japanese-coordinators
    question: 'Do you have Japanese-speaking Bridge SEs (BrSE) or Project Coordinators to prevent miscommunication?'
    answer: 'Yes. We assign dedicated Japanese-speaking coordinators who understand both AEC technical terminology and Japanese business etiquette (Ho-Ren-So / 報連相), ensuring your specifications, nuances, and schedule expectations are translated with 100% accuracy to our production team.'
  - id: zero-defect-quality
    question: 'How do you guarantee Japanese-level "Zero-Defect" quality (品質保証) in offshore BIM production?'
    answer: 'We implement a rigorous, documented multi-stage inspection checklist (自主検査チェックシート) modeled on Japanese Zenekon standards. Every sheet, tag, line weight, and clash check is verified and signed off before submission, and we track defect rates transparently at every milestone.'
  - id: building-standards-act
    question: "Can your models support Japan's Building Standards Act (建築基準法) confirmation applications (確認申請) and sunlight regulation (日影規制) checks?"
    answer: 'Yes. While final legal submission is handled by your registered Kenchikushi (建築士), we model precise floor areas, building heights, setback lines (斜線制限), and site topography so your compliance and sunlight-shadow verification software runs accurately without manual redrawing.'
  - id: isms-iso-27001
    question: 'How do you protect confidential development plans and meet Japanese corporate security standards (ISMS / ISO 27001)?'
    answer: 'We enforce strict information security protocols—including dedicated project environments, NDA/confidentiality pledges per engineer, zero USB/external transfer policies, and cloud-only CDE access—matching the security expectations of major Japanese real estate developers (Fudosan).'
  - id: design-refinements
    question: 'How do you handle frequent, ultra-detailed design refinements during Basic Design (基本設計) and Working Drawings (実施設計)?'
    answer: 'We maintain clean parametric family structures and structured revision logs so iterative refinements—whether in luxury hospitality joinery, façade louvers, or Japanese garden/landscape hardscaping—are reflected rapidly and consistently across all drawings.'
  - id: lcc-and-fm
    question: 'Can your BIM models support Life Cycle Costing (LCC) and long-term Facility Management (FM) after handover?'
    answer: 'Yes. Japanese developers prioritize long-term asset value and maintenance. We deliver structured LOD 500 As-Built models with standardized equipment/finish schedules ready for long-term building maintenance and lifecycle planning.'
  - id: why-vietnam
    question: 'Why should a Japanese developer choose Vietnam over other offshore destinations for BIM?'
    answer: "Vietnam shares a **2-hour time difference** with Tokyo (allowing near-real-time collaboration), deep cultural alignment in craftsmanship and diligence, and a proven track record as Japan's #1 preferred offshore engineering partner."
  - id: trial-project
    question: 'We value long-term partnerships—how do we safely start a relationship with BIM Delivery?'
    answer: 'We never rush a large contract. We propose starting with a small, clearly scoped **Trial Project (トライアル案件)**—such as one floor of an interior/architectural package or a landscape zone—so your team can evaluate our communication speed, Japanese drawing precision, and QA/QC rigor before building a long-term dedicated team.'
