  heading: Delivering BIM excellence across the globe
  paragraphs:
    - With teams working across several time zones, **BIM Delivery** provides **BIM modeling, Revit documentation, scan to BIM, and clash coordination** to clients in **North America, Europe, the Middle East, and Asia Pacific**, so work moves forward around the clock.
