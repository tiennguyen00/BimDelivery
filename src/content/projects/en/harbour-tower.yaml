tagline: One model, thirty storeys, no open clashes
intro:
  - '**Where three design models had to become one.** A 30 storey tower of shops, offices, and apartments, with separate architectural, structural, and services models that needed to be coordinated before the tender drawings went out.'
  - 'We federated the models in Navisworks and ran clash tests floor by floor, alongside the design rather than after it, so the coordination never held back the start on site.'
  - 'The model reached tender with ==no open hard clashes==, and the contractor priced from it with far fewer allowances for unknowns.'
