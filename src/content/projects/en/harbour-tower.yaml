writeUp:
  - heading: The brief
    paragraphs:
      - The design team had separate architectural, structural, and services models for a 30 storey tower with shops, offices, and apartments. They needed them **coordinated into one clash free model** before the tender drawings went out.
      - Every week of delay pushed back the start on site, so the coordination had to run alongside the design rather than after it.
  - heading: What we did
    paragraphs:
      - We federated the three models in Navisworks and ran clash tests floor by floor, starting with the plant levels where the services were densest.
      - Each week the design team received a short clash report, grouped by trade and ranked by cost to fix, with a marked up view for every issue. We rebuilt the shared Revit families so the fixes stayed fixed.
  - heading: The outcome
    paragraphs:
      - The model reached tender with ==no open hard clashes==, and the contractor priced from it with far fewer allowances for unknowns.
