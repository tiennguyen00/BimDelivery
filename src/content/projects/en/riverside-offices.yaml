writeUp:
  - heading: The brief
    paragraphs:
      - An architecture practice needed its concept design for a nine storey office block turned into a **full Revit model** that could carry the project from planning through to construction drawings.
  - heading: What we did
    paragraphs:
      - We built the model from the practice's sketches and 2D plans, level by level, with a curtain wall system set up to match the facade rhythm the architects had drawn.
      - Dynamo scripts placed and numbered the repeating facade panels, so a change to the grid updated hundreds of elements in minutes rather than days.
      - We set up sheets, views, and schedules to the practice's own standards, so their team could pick the model up and keep working without retraining.
  - heading: The outcome
    paragraphs:
      - The planning submission went in on time with renders straight from the model, and the same model now drives the construction drawing set.
