tagline: A facade drawn once, built by script
intro:
  - '**A concept sketch, carried all the way to construction.** An architecture practice needed its nine storey office block turned into a full Revit model that could take the project from planning to construction drawings.'
  - "We built the model level by level from the practice's sketches and plans. Dynamo scripts placed and numbered the repeating facade panels, so a change to the grid updated hundreds of elements in minutes."
  - 'The planning submission went in on time with renders straight from the model, and the same model now drives the ==construction drawing set==.'
