writeUp:
  - heading: The brief
    paragraphs:
      - A six storey hotel had its structure and its services designed by two different firms, and the ceiling voids above the corridors were too tight to leave the two to meet on site.
  - heading: What we did
    paragraphs:
      - We coordinated the structural and services models in Navisworks, starting with the corridor ceilings and the plant room, and kept every issue in BIM 360 with an owner and a due date.
      - Where ducts could not fit, we proposed new routes and beam penetrations and checked each one with the structural engineer before it went into the model.
  - heading: The outcome
    paragraphs:
      - The corridors kept their **design ceiling height**, and the services went in without a single redesign on site.
