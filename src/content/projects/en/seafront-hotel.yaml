tagline: Tight ceilings, no surprises on site
intro:
  - '**Two firms, one tight ceiling void.** A six storey hotel had its structure and its services designed separately, and the voids above the corridors were too tight to leave the two to meet on site.'
  - 'We coordinated both models in Navisworks, tracked every issue in BIM 360 with an owner and a due date, and checked each new duct route and beam penetration with the structural engineer.'
  - 'The corridors kept their ==design ceiling height==, and the services went in without a single redesign on site.'
