writeUp:
  - heading: The brief
    paragraphs:
      - The owners of a five storey corner building wanted to refit its ground floor shops and upper apartments, but had only scanned paper plans to work from.
  - heading: What we did
    paragraphs:
      - We modelled the whole building from a point cloud survey, with the shopfronts, the stairs, and every apartment layout drawn as built.
      - Alongside the model we issued **2D plans and sections** for the owners' consultants who do not work in Revit.
