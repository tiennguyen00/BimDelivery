writeUp:
  - heading: The brief
    paragraphs:
      - A college planned a new teaching wing beside its brick hall, and its architects needed the old building modelled first, so the new wing could meet it exactly.
  - heading: What we did
    paragraphs:
      - We modelled the hall's walls, roof, and openings from survey data and the original drawings, with the **junction faces** where the extension will join drawn to survey accuracy.
      - The architects now design the extension directly against the model of the hall.
