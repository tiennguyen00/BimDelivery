writeUp:
  - heading: The brief
    paragraphs:
      - A seven storey building from the 1920s was about to be stripped back and refitted as offices. The original drawings were incomplete, and decades of changes had never been recorded.
      - The design team needed an **accurate as built model** of every floor before they could plan the new interiors.
  - heading: What we did
    paragraphs:
      - We turned the laser scan survey into a Revit model of the walls, columns, stairs, ceilings, and the heritage features the planners asked to keep.
      - Where the scan showed walls out of plumb or floors out of level, we modelled them as they really are, and flagged every place the old drawings were wrong.
  - heading: The outcome
    paragraphs:
      - The interior designers started from a model they could trust, and the strip out found no surprises the model had not already shown.
