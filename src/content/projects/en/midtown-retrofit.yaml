intro:
  - '**A century of changes no drawing had recorded.** A seven storey building from the 1920s was about to be stripped back and refitted as offices, and the design team needed an accurate as built model of every floor first.'
  - 'We turned the laser scan survey into a Revit model, drew walls out of plumb and floors out of level as they really are, and flagged every place the old drawings were wrong.'
  - 'The strip out found ==no surprises== the model had not already shown.'
