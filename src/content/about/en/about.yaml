# The About Us page (spec 0010): three bands, top to bottom. The numbers in
# the first band are the shared `stats` entry, and the badges in the last are
# the footer's (`settings.footer.certification.badges`), so neither is here.
#
# The intro and the capability paragraphs are the client's About Us copy
# (BIM Delivery services.pdf). The accordion and the certification band are
# still placeholder copy, to be replaced before launch. A `**phrase**`
# renders bold, a `==phrase==` bold gold.
lang: en
seo:
  title: About Us | BIM Delivery
  description: Who we are, how we work, and why architects, engineers, and contractors trust BIM Delivery with their models.
heading: About BIM Delivery
intro: With extensive experience in **BIM and CAD production**, our team works with design drawings, CAD files, sketches, and other project information to develop ==accurate and coordinated 3D BIM models== and project documentation. Our services specialize in **Architecture, Interior Design, and Landscape** for 3D modeling and 2D documentation.
capability:
  heading: Your BIM partner from concept to handover
  paragraphs:
    - We understand that every project has different requirements, standards, and workflows. Our team can work within our clients' **existing processes and project environments**.
    - By working with **BIM Delivery**, clients can extend their production capacity with a ==flexible BIM team== while keeping their core teams focused on design, coordination, and project management. Our goal is to provide ==consistent, accurate, and practical BIM support== that helps our clients deliver projects efficiently.
  accordion:
    - title: Experience
      text: Our team has delivered ==more than a thousand projects== across residential, commercial, healthcare, education, and infrastructure work. We have modeled from sketches, drawings, and laser scans, and supported projects from early design through construction and facility management.
    - title: Expertise
      text: We work in ==Revit, Navisworks, AutoCAD, and ReCap==, and follow recognized BIM information management practice. Our specialists cover **architectural, interior, and landscape modeling**, clash detection, quantity takeoff, and construction documentation.
certification:
  heading: Certified quality you can rely on
  paragraphs:
    # PLACEHOLDER: the ISO names below are not confirmed certifications. Swap
    # them for the real ones (and the footer's badges) before launch.
    - '**BIM Delivery** works to management systems built on ISO 9001 for quality, ISO 19650 for BIM information management, and ISO/IEC 27001 for information security.'
    - These standards shape how we plan, model, check, and hand over every project, so you get consistent results and your data stays protected. Placeholder badges until the real certifications are confirmed.
