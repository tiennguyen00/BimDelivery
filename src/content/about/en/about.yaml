# The About & Services page (2026-10-11), top to bottom: the company, its
# experience and services, one band per service, then the media band, which
# has no copy yet. Each band is copy on one side and a full height photo on
# the other, the sides alternating down the page.
#
# The intro paragraph and the service texts are the client's copy (BIM
# Delivery services.pdf). The taglines are placeholder copy, to be replaced
# before launch. A `**phrase**` renders bold, a `==phrase==` bold brass.
lang: en
seo:
  title: About & Services | BIM Delivery
  description: Who BIM Delivery is, the experience behind the team, and the Architectural, Interior, and Landscape BIM services we deliver.
intro:
  # The company's name, the page's `h1`.
  heading: BIM Delivery
  tagline: BIM and CAD production for design teams
  paragraphs:
    - With extensive experience in **BIM and CAD production**, our team works with design drawings, CAD files, sketches, and other project information to develop ==accurate and coordinated 3D BIM models== and project documentation. Our services specialize in **Architecture, Interior Design, and Landscape** for 3D modeling and 2D documentation.
  cta: Discover more
  # PLACEHOLDER photo: the client is still choosing it.
  image:
    src: https://images.pexels.com/photos/6615107/pexels-photo-6615107.jpeg?auto=compress&cs=tinysrgb&w=1600
    alt: Three architects studying a white scale model of a building on a studio table
experience:
  heading: Experience and services
  tagline: Your BIM partner from concept to handover
  paragraphs:
    - Our team has delivered ==more than a thousand projects== across residential, commercial, healthcare, education, and infrastructure work. We understand that every project has different requirements, standards, and workflows, and we work within our clients' **existing processes and project environments**.
    - By working with **BIM Delivery**, clients extend their production capacity with a ==flexible BIM team== while keeping their core teams focused on design, coordination, and project management.
  cta: Explore our services
  # PLACEHOLDER photo: the client is still choosing it.
  image:
    src: https://images.pexels.com/photos/3862135/pexels-photo-3862135.jpeg?auto=compress&cs=tinysrgb&w=1600
    alt: Two engineers leaning over a large printed drawing spread out on a table
services:
  cue: Discover more
  # One band per service, in this order. A service with a page is named by
  # id; its title, summary, and photo come from that entry. A service with
  # no page yet writes its own title, tagline, and photo, and has no button.
  items:
    - service: en/architectural-bim
      text: For architectural projects, BIM supports the development of **3D building models, floor plans, elevations, sections, architectural details, schedules, and construction documentation**. We take your CAD drawings and design information to detailed BIM models, helping you ==improve coordination and deliver projects more efficiently==.
    - service: en/interior-bim
      text: For interior design projects, BIM supports **3D interior models, furniture and equipment layouts, material specifications, reflected ceiling plans, joinery, and finishes**. We take your design concepts to detailed BIM models and construction documentation, helping you ==improve coordination, efficiency, and project delivery==.
    - service: en/landscape-bim
      text: BIM brings landscape design, site information, and building elements together in a **coordinated 3D environment**. We develop **terrain, hardscape, planting areas, outdoor structures, levels, and paths** from your CAD drawings and design information, as ==detailed and coordinated landscape BIM models==.
