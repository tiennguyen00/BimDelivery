sections:
  - type: intro
    layout: carousel
    heading: Revit modeling services
    paragraphs:
      - BIM Delivery builds **architectural, structural, and MEP models in Revit** from your drawings, sketches, point clouds, or design intent. Every model follows your templates, naming, and level of detail, so it drops straight into the way your team already works.
      - From early design to handover, our modelers work as an extension of your office. We model from **LOD 100 to LOD 500**, set up sheets and views to your standards, and check each milestone before it reaches you.
      - The result is a coordinated, data rich model that helps you **cut rework, find problems early, and keep delivery on schedule**, whatever the size of the project.
    images:
      - src: https://images.pexels.com/photos/15764095/pexels-photo-15764095.jpeg?auto=compress&cs=tinysrgb&w=1600
        alt: Two people discussing a 3D house model on a laptop
      - src: https://images.pexels.com/photos/15764116/pexels-photo-15764116.jpeg?auto=compress&cs=tinysrgb&w=1600
