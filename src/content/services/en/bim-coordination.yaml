      - src: https://images.pexels.com/photos/3862135/pexels-photo-3862135.jpeg?auto=compress&cs=tinysrgb&w=1600
        alt: Two engineers leaning over a large printed drawing spread out on a table
  - type: features
    layout: split
    surface: dark
    heading: Coordination that ==prevents rework==
    paragraphs:
      - Clashes are cheapest to fix before anything is built. We federate the models from every trade, run clash detection, and work through each issue with the team that owns it, until the model is **clean and signed off**.
      - You get ==clear reports and tracked issues==, not just a long list of clashes, so every meeting ends with decisions and owners.
    items:
      - icon: clash
        title: Clash detection
