  - type: process
    layout: timeline
    surface: dark
    heading: How coordination ==runs==
    intro: A steady cycle that repeats until every clash is closed and every trade has signed off.
    steps:
      - title: Collect
        text: We gather the latest model from every discipline and check each one is usable.
      - title: Federate
        text: The models are combined into one, aligned to shared levels and grids.
      - title: Detect
        text: Clash runs find the conflicts, grouped and ranked by what matters most.
      - title: Resolve
        text: Each issue goes to its owner and is tracked until the fix is in the model.
      - title: Sign off
        text: Every trade approves the coordinated model before it goes to site.
