sections:
  - type: intro
    layout: carousel
    heading: BIM coordination services
    paragraphs:
      - BIM Delivery brings the models from **every discipline** together, runs clash detection, and works with each trade until the model is **coordinated and ready to build**. Problems get solved on screen, where a fix costs minutes, not on site, where it costs weeks.
      - We run coordination for projects of every size, from a single building to a large campus, and we fit around the tools and meeting rhythm your project already uses.
      - The result is fewer requests for information, fewer change orders, and a construction team that can **trust the model** it builds from.
    images:
