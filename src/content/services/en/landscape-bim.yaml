  - type: features
    layout: split
    surface: dots
    heading: Coordination that ==prevents rework==
    paragraphs:
      - One of the key advantages of BIM for landscape design is **improved coordination** between the landscape and other project disciplines. Landscape elements can be reviewed alongside architectural and structural models, helping teams ==identify potential conflicts and resolve design issues== before construction.
      - You get ==clear reports and tracked issues==, not just a long list of clashes, so every meeting ends with decisions and owners.
    items:
      - icon: layers
        title: Site and landscape models
        text: Terrain, hardscape, planting areas, and outdoor structures in **one coordinated model**.
      - icon: ruler
        title: Terrain, levels, and paths
        text: Levels, slopes, and paths modeled so the site meets the buildings where it should.
      - icon: blueprint
        title: Landscape documentation
        text: Plans, sections, and details drawn from the model and set up to your standards.
      - icon: clash
        title: Clash detection
        text: Hard and soft clash runs, grouped and ranked so the **real problems** surface first.
      - icon: clipboard-check
        title: Issue reports
        text: Clear reports with views, owners, and due dates, shared in the format your team uses.
      - icon: building-check
        title: Construction ready model
        text: A final model signed off by every discipline before work starts on site.
  - type: audiences
    layout: grid
    heading: Who we ==work with==
    intro: Landscape designers and multidisciplinary design teams whose outdoor spaces meet the architecture, terrain, and infrastructure around them.
    items:
      - icon: compass
        title: Landscape designers
        text: Your design developed into a detailed, coordinated model, so your team can stay focused on **design**.
      - icon: users
        title: Multidisciplinary teams
        text: Landscape reviewed alongside the architecture and structure, with conflicts resolved before construction.
      - icon: user
        title: Architects
        text: Outdoor spaces that fit the building, its levels, and its entrances.
      - icon: hard-hat
        title: General contractors
        text: One coordinated site model and a clear issue log across every trade on your project.
      - icon: building
        title: Developers
        text: Fewer change orders and delays, and a budget that holds through construction.
      - icon: presenter
        title: Project managers
        text: Coordination progress you can report on, meeting by meeting.
  - type: process
    layout: timeline
    surface: dots
    heading: How a Landscape BIM project ==runs==
    intro: A steady cycle that repeats until every clash is closed and every discipline has signed off.
    steps:
      - title: Collect
        text: We gather your CAD drawings, design information, and the latest model from every discipline.
      - title: Model
        text: We build the landscape model, aligned to the shared levels and grids of the project.
      - title: Detect
        text: Clash runs find the conflicts, grouped and ranked by what matters most.
      - title: Resolve
        text: Each issue goes to its owner and is tracked until the fix is in the model.
      - title: Sign off
        text: Every discipline approves the coordinated model before it goes to site.
    cta:
      heading: Start a Landscape BIM project
      text: Tell us about your site and its design, and we will reply with a plan and a quote.
      button:
        label: Contact us
        href: /contact-us
  - type: presence
    layout: map
