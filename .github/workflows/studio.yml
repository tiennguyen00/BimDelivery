# Redeploys the Sanity Studio when a change under studio/ reaches main
# (spec 0019, AC-16), so the Studio's rules never drift from the site's.
# Uses a Deploy Studio robot token, never an Administrator token. If the
# Sanity plan offers no such token, delete this file and deploy by hand:
#   pnpm --filter bim-delivery-studio run deploy

name: Deploy Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      # The Studio reads the site's shared rules.
      - 'src/lib/project-fields.ts'
      - 'src/i18n/locales.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-studio
      cancel-in-progress: true
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter bim-delivery-studio
      - run: pnpm --filter bim-delivery-studio run typecheck
      - name: Deploy the Studio
        run: pnpm --filter bim-delivery-studio exec sanity deploy --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
